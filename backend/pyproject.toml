[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragverse-core"
version = "0.1.4"
description = ''
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "inboard[fastapi]==0.56.*",
  "python-multipart>=0.0.5",
  "email-validator>=1.3.0",
  "requests>=2.28.1",
  "celery>=5.2.7",
  "passlib[bcrypt]>=1.7.4",
  "tenacity>=8.1.0",
  "emails>=0.6.0",
  "raven>=6.10.0",
  "jinja2>=3.1.2",
  "python-jose[cryptography]>=3.3.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.0.3",
  "httpx>=0.23.1",
  "psycopg2-binary>=2.9.5",
  "setuptools>=65.6.3",
  "motor>=3.7.0",
  "pytest==7.4.2",
  "pytest-cov==4.1.0",
  "pytest-asyncio>=0.21.0",
  "argon2-cffi==23.1.0",
  "argon2-cffi-bindings==21.2.0",
  "odmantic>=1.0.2",
  "llama-index-core>=0.11.0,<0.12.0",
  "llama-index-cli>=0.4.1,<0.5",
  "llama-index-embeddings-huggingface>=0.5.3",
  "llama-index-llms-groq>=0.3.2",
  "llama-index-readers-file>=0.4.0,<0.5",
  "llama-index-storage-chat-store-redis>=0.4.1",
  "llama-index-vector-stores-milvus>=0.8.1",
  "llama-index-llms-ollama>=0.5.4",
  "llama-index-readers-web>=0.4.1",
  "tree-sitter>=0.25.1",
  "tree-sitter-language-pack>=0.9.0", 
  "boto3"
]

[tool.hatch.envs.default]
dependencies = []

[tool.hatch.envs.prod-build]
dev-mode = false

[tool.hatch.build.targets.wheel]
packages = ["app"]